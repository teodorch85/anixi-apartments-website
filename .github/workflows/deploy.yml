# Builds the site and uploads the changed files to DNHOST by FTP after every change
# (including edits made in Pages CMS).
#
# Repository settings → Secrets and variables → Actions:
#   Secrets:   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
#   Variables: SITE_URL  (https://www.anixi-apartments.gr)
#              BASE_PATH (/new while previewing in a sub-folder, empty for the live site)
#              FTP_DIR   (/httpdocs/new/ while previewing, later /httpdocs/)
#              PREVIEW   (1 while previewing = hidden from Google, 0 for the live site)
#
# Big changes (hundreds of files): download the "site-dist" artifact of a run, upload it with WinSCP,
# then run this workflow by hand with mode = seed.
name: Build & deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "deploy = upload changes · seed = only mark the server as up to date (after a WinSCP upload)"
        type: choice
        options: [deploy, seed]
        default: deploy

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          PREVIEW: ${{ vars.PREVIEW }}
          BASE_PATH: ${{ vars.BASE_PATH }}

      - name: Keep the built site as a download (for manual WinSCP uploads)
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist/
          include-hidden-files: true
          retention-days: 1   # ~80 MB each push: keep only a day (Actions storage is 0.5 GB)

      - name: Upload to DNHOST (only changed files)
        run: |
          sudo apt-get install -y -qq lftp >/dev/null
          node scripts/deploy.mjs
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ vars.FTP_DIR }}
          DEPLOY_MODE: ${{ inputs.mode || 'deploy' }}
